version: '3.4'

networks:
  k6:
  grafana:
  concert:
    external: true

services:
  influxdb:
    container_name: hh-influxdb
    image: influxdb:1.8
    networks:
      - k6
      - grafana
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_MAX_BODY_SIZE=20MB
      - INFLUXDB_HTTP_WRITE_TIMEOUT=10s
      - INFLUXDB_HTTP_READ_TIMEOUT=10s
      - INFLUXDB_MAX_MEMORY_SIZE=500MB
      - INFLUXDB_STORAGE_WAL_FLUSH_INTERVAL=10s
      - INFLUXDB_STORAGE_WAL_FLUSH_SIZE=500MB

  grafana:
    container_name: hh-grafana
    image: grafana/grafana:9.3.8
    networks:
      - grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana:/etc/grafana/provisioning/

  k6:
    container_name: hh-k6
    image: grafana/k6:latest
    networks:
      - k6
      - concert
    ports:
      - "6565:6565"
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    command: run /test/test.js
    volumes:
      - ./:/test
